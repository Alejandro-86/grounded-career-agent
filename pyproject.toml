[project]
name = "grounded-career-agent"
version = "0.1.0"
description = "JD fit/gap analysis and CV tailoring agent with a code-enforced grounding guardrail, an eval harness, Delta Lake persistence and MLflow tracing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "mlflow-skinny>=2.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
career-agent = "career_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_agent = ["webapp/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # long strings are left to the formatter; str-Enum is intentional

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
